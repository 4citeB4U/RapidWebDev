name: Verify LeeWay transitional story

on:
  pull_request:
    paths:
      - 'leeway-story.html'
      - 'leeway-application.manifest.json'
      - 'brain/public-project-adapter.js'
      - 'index.html'
      - 'scripts/verify-leeway-story.mjs'
      - '.github/workflows/verify-leeway-story.yml'
  push:
    branches: [main]
    paths:
      - 'leeway-story.html'
      - 'leeway-application.manifest.json'
      - 'brain/public-project-adapter.js'
      - 'index.html'
      - 'scripts/verify-leeway-story.mjs'
      - '.github/workflows/verify-leeway-story.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify story, provenance, and authority
        run: node scripts/verify-leeway-story.mjs
