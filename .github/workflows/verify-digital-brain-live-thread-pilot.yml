name: Verify Digital Brain live thread pilot

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "brain/public/public-brain.js"
      - "brain/public/machine-consciousness-public.js"
      - "brain/public/voice-fabric-session.js"
      - "brain/public/browser-listener.js"
      - "brain/public/voice-controller.js"
      - "brain/public/ecosystem-fabric.js"
      - "brain/public/experience.css"
      - "brain/public/thread-workplane.js"
      - "brain/public/speech-lease-patch.js"
      - "brain/public/conversation-view.js"
      - "brain/public/public-brain.css"
      - ".github/workflows/verify-digital-brain-live-thread-pilot.yml"
  workflow_dispatch:

jobs:
  live-pages-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages publication and verify served pilot
        shell: bash
        run: |
          set -euo pipefail
          URL="https://4citeb4u.github.io/RapidWebDev/"
          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsSL --max-time 20 "$URL" || true)"
            if printf '%s' "$body" | grep -q 'thread-workplane.js?v=20260928-threadpilot2' \
              && printf '%s' "$body" | grep -q 'machine-consciousness-public.js?v=20261109-conversation1' \
              && printf '%s' "$body" | grep -q 'browser-listener.js?v=20261109-leeway1' \
              && printf '%s' "$body" | grep -q 'voice-fabric-session.js?v=20261109-stream3' \
              && printf '%s' "$body" | grep -q 'voice-controller.js?v=20261109-leeway1' \
              && printf '%s' "$body" | grep -q 'public-brain.js?v=20261109-conversation1' \
              && printf '%s' "$body" | grep -q 'id="agentThreadSelect"' \
              && printf '%s' "$body" | grep -q 'id="agentNewSide"' \
              && printf '%s' "$body" | grep -q 'id="agentVoiceSelect"' \
              && ! printf '%s' "$body" | grep -q 'id="agentStartupStatus"' \
              && ! printf '%s' "$body" | grep -q 'speech-lease-patch.js'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
          printf '%s\n' '{"live_url":"https://4citeb4u.github.io/RapidWebDev/","served_thread_workplane":true,"served_machine_consciousness":true,"served_voice_fabric_session":true,"served_thread_controls":true,"acoustic_test":"NOT_PERFORMED"}' > live-smoke.json
      - name: Upload live smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: digital-brain-live-thread-pilot-smoke
          path: live-smoke.json
