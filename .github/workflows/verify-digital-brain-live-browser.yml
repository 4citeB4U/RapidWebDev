name: Verify Digital Brain live browser pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-digital-brain-live-browser.yml"
      - "index.html"
      - "brain/public/public-brain.js"
      - "brain/public/machine-consciousness-public.js"
      - "brain/public/voice-fabric-session.js"
      - "brain/public/browser-listener.js"
      - "brain/public/voice-controller.js"
      - "brain/public/ecosystem-fabric.js"
      - "brain/public/experience.css"
      - "brain/public/thread-workplane.js"
      - "brain/public/speech-lease-patch.js"
  workflow_dispatch:

jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/leeway-live-browser"
          cd "$RUNNER_TEMP/leeway-live-browser"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for current Digital Brain deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="https://4citeb4u.github.io/RapidWebDev/"
          ok=0
          for i in $(seq 1 30); do
            body="$(curl -fsSL --max-time 20 "$URL" || true)"
            if printf '%s' "$body" | grep -q '/brain/public/thread-workplane.js?' \
              && printf '%s' "$body" | grep -q '/brain/public/public-brain.js?'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
      - name: Exercise live Digital Brain thread controls
        shell: bash
        run: |
          cd "$RUNNER_TEMP/leeway-live-browser"
          cat > verify.cjs <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const url='https://4citeb4u.github.io/RapidWebDev/';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#agentThreadSelect',{state:'attached',timeout:30000});
            if(await page.locator('#leewayIntroGate').count())throw new Error('The obsolete Digital Brain intro gate is still present.');
            if(await page.locator('#introStoryGlass').count())throw new Error('The obsolete opening story overlay is still present.');
            const pageText=await page.locator('body').innerText();
            if(/Talk with Agent Lee|Full AI optional|optional AI models|Gemma 4 runs in the visitor/i.test(pageText))throw new Error('Obsolete optional-model or opening UI text is still visible.');
            const before=await page.locator('#agentThreadSelect option').count();
            const initial=await page.locator('#agentThreadStatus').textContent();
            const loaded=await page.evaluate(()=>({
              workplane:typeof globalThis.LeeWayThreadWorkplane==='function',
              machineConsciousness:typeof globalThis.LeeWayMachineConsciousnessPublic?.answer==='function',
              voiceFabric:typeof globalThis.LeeWayPortfolioVoiceSession?.speak==='function',
              browserVoiceRemoved:typeof globalThis.LeeWayBrowserVoice==='undefined'
            }));
            if(!Object.values(loaded).every(Boolean))throw new Error('Machine Consciousness/Voice Fabric pilot globals are incomplete: '+JSON.stringify(loaded));
            if(!String(initial).includes('/8 hands active'))throw new Error('Eight-hand status is not visible: '+initial);
            const introGate=page.locator('#leewayIntroGate');
            if(await introGate.isVisible().catch(()=>false)){
              const skip=page.locator('#introSkip');
              if(await skip.isVisible().catch(()=>false)) await skip.click();
              else if(await page.locator('#introEnter').isEnabled().catch(()=>false)) await page.locator('#introEnter').click();
              await page.waitForFunction(()=>{
                const node=document.querySelector('#leewayIntroGate');
                return !node || node.classList.contains('intro-gate-hidden');
              });
            }
            const story=page.locator('#introStoryGlass');
            if(await story.isVisible().catch(()=>false)){
              const skipStory=page.locator('#introStorySkip');
              if(await skipStory.isVisible().catch(()=>false)) await skipStory.click();
              else await page.locator('#introStoryTalk').dispatchEvent('click');
              await page.waitForFunction(()=>!document.querySelector('#introStoryGlass'));
            }
            if(await page.locator('#agentStartupStatus').count())throw new Error('The removed LeeWay fabric status chip is still present.');
            await page.waitForSelector('#agentBubble:not(.hidden)',{timeout:10000});
            await page.click('#micBtn');
            await page.waitForTimeout(250);
            if(await page.locator('#leewayIntroGate').count()||await page.locator('#introStoryGlass').count())throw new Error('An opening overlay returned after the Agent Lee click.');
            await page.locator('#typeMessage').evaluate(node=>{node.open=true});
            await page.fill('#agentInput','What is Machine Consciousness?');
            await page.click('#agentSend');
            await page.waitForFunction(()=>{
              const text=document.querySelector('#agentText')?.textContent?.trim()||'';
              return text.length>40&&!/^Agent Lee here\b/i.test(text);
            },null,{timeout:15000});
            const reply=await page.locator('#agentText').textContent();
            if(!/LeeWay|Machine Consciousness|Digital Brain/i.test(String(reply)))throw new Error('Live answer did not carry the admitted LeeWay subject: '+reply);
            await page.click('#agentNewSide');
            await page.waitForFunction(n=>document.querySelectorAll('#agentThreadSelect option').length===n+1,before);
            const after=await page.locator('#agentThreadSelect option').count();
            const selected=await page.locator('#agentThreadSelect option:checked').textContent();
            const status=await page.locator('#agentThreadStatus').textContent();
            if(!/Side chat \[LW-THREAD-\d+\]/.test(String(selected)))throw new Error('Side thread ID not exposed: '+selected);
            if(pageErrors.length)throw new Error('Uncaught live page errors: '+JSON.stringify(pageErrors));
            const result={url,beforeOptions:before,afterOptions:after,selected,status,loaded,pageErrors,acousticVoice:'NOT_TESTED',optionalModelRoutes:'REMOVED'};
            fs.writeFileSync('live-browser.json',JSON.stringify(result,null,2));
            await page.screenshot({path:'live-browser.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          node verify.cjs
      - name: Upload live browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: digital-brain-live-browser-pilot
          path: |
            ${{ runner.temp }}/leeway-live-browser/live-browser.json
            ${{ runner.temp }}/leeway-live-browser/live-browser.png
